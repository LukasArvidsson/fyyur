{% extends 'layouts/main.html' %}
{% block title %}Fyyur | Venues Search{% endblock %}
{% block content %}
<h3>{{ results.count }} result{% if results.count != 1 %}s{% endif %} for "{{ search_term }}"</h3>
<ul class="items">
	{% for venue in results.data %}
	<li>
		<a href="/venues/{{ venue.id }}">
			<div class="item image-thumbnail-container">
				<img src="{{ venue.image_link }}" alt="{{ venue.name }} image" class="image-thumbnail"/>
				<div>
					<h4>{{ venue.name }}</h4>
				</div>
			</div>
		</a>
	</li>
	{% endfor %}
</ul>
{% endblock %}
